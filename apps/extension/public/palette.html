<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Provenance Lens</title>
    <link rel="stylesheet" href="palette.css" />
  </head>
  <body>
    <div id="palette" class="palette" hidden>
      <div id="scrim" class="scrim"></div>
      <div
        id="panel"
        class="panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="palette-title"
      >
        <h1 id="palette-title" class="visually-hidden">Provenance Lens</h1>
        <div class="search">
          <button
            id="back"
            class="back"
            type="button"
            tabindex="-1"
            aria-label="Back"
            hidden
          >
            <svg class="icon" aria-hidden="true">
              <use href="#i-chevron-right"></use>
            </svg>
          </button>
          <button
            id="chip"
            class="chip"
            type="button"
            tabindex="-1"
            hidden
          ></button>
          <input
            id="query"
            class="query"
            type="text"
            role="combobox"
            aria-controls="list"
            aria-expanded="true"
            aria-autocomplete="list"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search commands and settings"
          />
          <span id="accessory" class="accessory"></span>
          <span id="spinner" class="spinner" aria-hidden="true" hidden></span>
        </div>
        <p id="hint" class="hint" hidden></p>
        <div id="detail" class="detail" hidden></div>
        <div
          id="list"
          class="list"
          role="listbox"
          aria-label="Commands and settings"
        ></div>
        <p
          id="live"
          class="visually-hidden"
          role="status"
          aria-live="polite"
        ></p>
        <footer class="footer">
          <span class="footer-status" role="status">
            <span id="status-dot" class="dot"></span>
            <span id="status-text"></span>
          </span>
          <span class="footer-keys">
            <span id="footer-back" class="footer-key" hidden
              >Back <kbd>esc</kbd></span
            >
            <span id="footer-verb" class="footer-key"
              ><span id="footer-verb-text">Open</span> <kbd>↵</kbd></span
            >
            <span class="divider" aria-hidden="true"></span>
            <button
              id="actions-button"
              class="actions-button"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              Actions <kbd id="actions-key">⌘K</kbd>
            </button>
          </span>
        </footer>
        <div id="actions" class="actions" hidden>
          <input
            id="actions-query"
            class="actions-query"
            type="text"
            role="combobox"
            aria-controls="actions-list"
            aria-expanded="true"
            aria-autocomplete="list"
            aria-label="Search actions"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search actions"
          />
          <div
            id="actions-list"
            class="actions-list"
            role="listbox"
            aria-label="Actions"
          ></div>
        </div>
      </div>
    </div>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14" />
      </symbol>
      <symbol id="i-shield-check" viewBox="0 0 24 24">
        <path
          d="M12 3l7.5 3v5.5c0 4.5-3.2 8.2-7.5 9.5-4.3-1.3-7.5-5-7.5-9.5V6zM8.75 12.25l2.25 2.25 4.25-4.5"
        />
      </symbol>
      <symbol id="i-scissors" viewBox="0 0 24 24">
        <path
          d="M9 6a3 3 0 1 1-6 0a3 3 0 1 1 6 0zM9 18a3 3 0 1 1-6 0a3 3 0 1 1 6 0zM8.5 7.5L20 19M8.5 16.5L20 5"
        />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2" />
      </symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24">
        <path d="M4 7h10M18 7h2M16 5v4M4 17h4M12 17h8M10 15v4" />
      </symbol>
      <symbol id="i-film" viewBox="0 0 24 24">
        <path
          d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4"
        />
      </symbol>
      <symbol id="i-mic" viewBox="0 0 24 24">
        <path
          d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"
        />
      </symbol>
      <symbol id="i-music" viewBox="0 0 24 24">
        <path
          d="M9 18V5l11-2v13M9 18a2.5 2.5 0 1 1-5 0a2.5 2.5 0 1 1 5 0zM20 16a2.5 2.5 0 1 1-5 0a2.5 2.5 0 1 1 5 0z"
        />
      </symbol>
      <symbol id="i-waveform" viewBox="0 0 24 24">
        <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4" />
      </symbol>
      <symbol id="i-image" viewBox="0 0 24 24">
        <path
          d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM4 16l4.5-4.5 4 4 2.5-2.5 5 5M15.5 8.5h.01"
        />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path
          d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"
        />
      </symbol>
      <symbol id="i-key" viewBox="0 0 24 24">
        <path
          d="M11 15.5a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0zM10 13l9-9M16 7l3 3M14 9l2 2"
        />
      </symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24">
        <path
          d="M4 6h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM7 10h.01M10.5 10h.01M14 10h.01M17.5 10h.01M8 14h8"
        />
      </symbol>
      <symbol id="i-plug" viewBox="0 0 24 24">
        <path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4" />
      </symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24">
        <path d="M9 6l6 6-6 6" />
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path
          d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"
        />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M5 12.5l4.5 4.5L19 7.5" />
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 8h.01" />
      </symbol>
      <symbol id="i-alert-triangle" viewBox="0 0 24 24">
        <path
          d="M10.3 4.2L2.6 17.5a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0zM12 9.5v4M12 17h.01"
        />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6L6 18" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <path
          d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V8a4 4 0 0 1 8 0v3"
        />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <path
          d="M9 9h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1zM16 9V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h4"
        />
      </symbol>
    </svg>
    <script type="module" src="palette.js"></script>
  </body>
</html>
