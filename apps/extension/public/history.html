<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Provenance Lens history</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page">
    <main class="page-shell" aria-labelledby="page-title">
      <header class="brand">
        <img src="icons/icon-48.png" alt="" width="36" height="36" />
        <div>
          <p class="eyebrow">Provenance Lens</p>
          <h1 id="page-title">Result history</h1>
        </div>
      </header>
      <section class="card stack" aria-labelledby="filter-heading">
        <div class="row">
          <h2 id="filter-heading">Recent checks</h2>
          <label for="history-filter" class="sr-only">Filter history</label>
          <select id="history-filter" aria-label="Filter history">
            <option value="all">All</option>
            <option value="detected">Detected</option>
            <option value="not-detected">No supported signal</option>
            <option value="error">Error or indeterminate</option>
          </select>
        </div>
        <div class="row">
          <label for="history-period">History period</label>
          <select id="history-period" aria-label="History period">
            <option value="24h">Last 24 hours</option>
            <option value="7d">Last 7 days</option>
            <option value="30d">Last 30 days</option>
            <option value="all" selected>All history</option>
          </select>
        </div>
        <p id="history-stats" class="muted small" aria-live="polite"></p>
        <div class="actions">
          <button id="clear-history" class="danger" type="button">
            Clear all
          </button>
        </div>
        <p
          id="history-status"
          class="status"
          role="status"
          aria-live="polite"
        ></p>
        <ul id="history-list" class="history-list" aria-live="polite"></ul>
      </section>
    </main>
    <script type="module" src="history.js"></script>
  </body>
</html>
